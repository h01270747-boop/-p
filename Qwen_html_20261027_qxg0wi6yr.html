<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Siri">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Siri AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- iOS 26 Siri Edge Glow (حاشیه نورانی دور صفحه) --- */
        .siri-edge-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        
        .siri-edge-glow.active {
            opacity: 1;
            animation: edgePulse 3s infinite ease-in-out;
        }

        .siri-edge-glow::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50px;
            padding: 3px;
            background: linear-gradient(45deg, 
                #007AFF, #5856D6, #FF2D55, #FF9500, #AF52DE, #007AFF);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            filter: blur(8px);
            animation: borderRotate 4s linear infinite;
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes edgePulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        /* --- Wallpaper --- */
        .wallpaper {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(88, 86, 214, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 45, 85, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 122, 255, 0.08) 0%, transparent 70%),
                #000;
            z-index: 0;
        }

        /* --- Status Bar --- */
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            font-size: 16px;
            font-weight: 600;
            z-index: 100;
        }

        /* --- Dynamic Island --- */
        .dynamic-island {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 20px;
            z-index: 200;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dynamic-island.active {
            width: 350px;
            height: 50px;
            border-radius: 25px;
        }

        /* --- Siri Orb (iOS 26 Liquid Design) --- */
        .siri-container {
            position: fixed;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 280px;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .siri-container.active {
            bottom: 50%;
            transform: translate(-50%, 50%) scale(1.3);
        }

        .siri-orb {
            position: absolute;
            width: 100%;
            height: 100%;
            filter: blur(40px);
            mix-blend-mode: screen;
        }

        .blob {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            mix-blend-mode: screen;
            filter: blur(30px);
        }

        .blob-1 {
            background: radial-gradient(circle, #007AFF, transparent 65%);
            animation: liquid1 12s infinite alternate ease-in-out;
        }
        .blob-2 {
            background: radial-gradient(circle, #FF2D55, transparent 65%);
            animation: liquid2 14s infinite alternate ease-in-out;
        }
        .blob-3 {
            background: radial-gradient(circle, #5856D6, transparent 65%);
            animation: liquid3 11s infinite alternate ease-in-out;
        }
        .blob-4 {
            background: radial-gradient(circle, #FF9500, transparent 65%);
            animation: liquid4 13s infinite alternate ease-in-out;
        }
        .blob-5 {
            background: radial-gradient(circle, #AF52DE, transparent 65%);
            animation: liquid5 15s infinite alternate ease-in-out;
        }

        @keyframes liquid1 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(60px, -40px) scale(1.4) rotate(120deg); }
            66% { transform: translate(-50px, 50px) scale(0.8) rotate(240deg); }
            100% { transform: translate(30px, -20px) scale(1.2) rotate(360deg); }
        }
        @keyframes liquid2 {
            0% { transform: translate(0, 0) scale(0.9) rotate(0deg); }
            33% { transform: translate(-60px, 40px) scale(1.3) rotate(-120deg); }
            66% { transform: translate(50px, -50px) scale(1.1) rotate(-240deg); }
            100% { transform: translate(-30px, 20px) scale(0.9) rotate(-360deg); }
        }
        @keyframes liquid3 {
            0% { transform: translate(0, 0) scale(1.1) rotate(0deg); }
            33% { transform: translate(40px, 60px) scale(0.9) rotate(180deg); }
            66% { transform: translate(-60px, -40px) scale(1.4) rotate(360deg); }
            100% { transform: translate(20px, 30px) scale(1) rotate(540deg); }
        }
        @keyframes liquid4 {
            0% { transform: translate(0, 0) scale(0.8) rotate(0deg); }
            33% { transform: translate(-40px, -60px) scale(1.2) rotate(-180deg); }
            66% { transform: translate(60px, 40px) scale(0.9) rotate(-360deg); }
            100% { transform: translate(-20px, -30px) scale(1.1) rotate(-540deg); }
        }
        @keyframes liquid5 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(50px, 50px) scale(1.3) rotate(180deg); }
            100% { transform: translate(-50px, -50px) scale(0.8) rotate(360deg); }
        }

        /* Listening State - Faster, more intense */
        .siri-container.listening .blob {
            animation-duration: 2s !important;
            filter: blur(20px);
        }

        /* --- Chat Area --- */
        .chat-area {
            position: fixed;
            top: 70px;
            bottom: 300px;
            left: 0;
            right: 0;
            padding: 20px;
            overflow-y: auto;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .chat-area::-webkit-scrollbar { display: none; }
        .chat-area.visible { opacity: 1; }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 16px;
            line-height: 1.5;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: messageIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            word-wrap: break-word;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user {
            align-self: flex-end;
            background: rgba(0, 122, 255, 0.35);
            border: 1px solid rgba(0, 122, 255, 0.5);
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            border-bottom-left-radius: 6px;
        }

        .message.ai.thinking {
            display: flex;
            gap: 6px;
            padding: 18px;
        }

        .thinking-dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: thinkingBounce 1.4s infinite ease-in-out;
        }
        .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes thinkingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* --- Input Area --- */
        .input-area {
            position: fixed;
            bottom: 40px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 30;
        }

        .input-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 14px 22px;
            color: #fff;
            font-size: 16px;
            outline: none;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transition: all 0.3s;
        }
        .input-box:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(0, 122, 255, 0.5);
        }
        .input-box::placeholder { color: rgba(255, 255, 255, 0.5); }

        .mic-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.4), rgba(88, 86, 214, 0.4));
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
        }
        .mic-btn:active { transform: scale(0.9); }
        .mic-btn.listening {
            background: linear-gradient(135deg, #FF2D55, #FF9500);
            animation: micPulse 1.5s infinite;
        }
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 45, 85, 0.7); }
            50% { box-shadow: 0 0 0 15px rgba(255, 45, 85, 0); }
        }
        .mic-btn svg { width: 24px; height: 24px; fill: #fff; }

        /* --- Home Indicator --- */
        .home-indicator {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: #fff;
            border-radius: 100px;
            z-index: 50;
        }

        /* --- Install Banner --- */
        .install-banner {
            position: fixed;
            bottom: 100px;
            left: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 100;
            animation: slideUp 0.4s ease;
        }
        .install-banner.show { display: flex; }
        
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .install-banner-text {
            flex: 1;
            font-size: 14px;
        }
        .install-btn {
            background: #007AFF;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="wallpaper"></div>
    
    <!-- iOS 26 Edge Glow -->
    <div class="siri-edge-glow" id="edgeGlow"></div>
    
    <!-- Dynamic Island -->
    <div class="dynamic-island" id="dynamicIsland"></div>
    
    <!-- Status Bar -->
    <div class="status-bar">
        <span id="timeDisplay">9:41</span>
        <span>📶 📡 🔋</span>
    </div>

    <!-- Siri Orb -->
    <div class="siri-container" id="siriOrb">
        <div class="siri-orb">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
            <div class="blob blob-4"></div>
            <div class="blob blob-5"></div>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea"></div>

    <!-- Input -->
    <div class="input-area">
        <input type="text" class="input-box" id="textInput" placeholder="از Siri بپرسید...">
        <button class="mic-btn" id="micBtn">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
    </div>

    <div class="home-indicator"></div>

    <!-- Install Banner -->
    <div class="install-banner" id="installBanner">
        <div class="install-banner-text">نصب روی Home Screen</div>
        <button class="install-btn" id="installBtn">نصب</button>
    </div>

    <script>
        // ⚙️ تنظیمات - آدرس Cloudflare Worker شما
        const WORKER_URL = 'https://your-worker.your-subdomain.workers.dev'; // 👈 این را تغییر دهید

        const chatArea = document.getElementById('chatArea');
        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const siriOrb = document.getElementById('siriOrb');
        const edgeGlow = document.getElementById('edgeGlow');
        const dynamicIsland = document.getElementById('dynamicIsland');
        const timeDisplay = document.getElementById('timeDisplay');

        // Conversation history
        let conversationHistory = [];

        // Update time
        function updateTime() {
            const now = new Date();
            timeDisplay.textContent = now.toLocaleTimeString('fa-IR', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: false 
            });
        }
        updateTime();
        setInterval(updateTime, 1000);

        function activateSiri() {
            siriOrb.classList.add('active');
            edgeGlow.classList.add('active');
            dynamicIsland.classList.add('active');
            chatArea.classList.add('visible');
        }

        function deactivateSiri() {
            siriOrb.classList.remove('active', 'listening');
            edgeGlow.classList.remove('active');
            dynamicIsland.classList.remove('active');
        }

        function addMessage(text, type) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            chatArea.appendChild(msg);
            chatArea.scrollTop = chatArea.scrollHeight;
            activateSiri();
            return msg;
        }

        function addThinking() {
            const msg = document.createElement('div');
            msg.className = 'message ai thinking';
            msg.innerHTML = '<div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div>';
            chatArea.appendChild(msg);
            chatArea.scrollTop = chatArea.scrollHeight;
            return msg;
        }

        async function callGroqAPI(userMessage) {
            conversationHistory.push({ role: 'user', content: userMessage });

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { 
                                role: 'system', 
                                content: 'تو سیری هستی، دستیار هوش مصنوعی اپل. پاسخ‌های کوتاه، دوستانه و مفید به فارسی بده. لحن طبیعی و صمیمی داشته باش.'
                            },
                            ...conversationHistory
                        ]
                    })
                });

                if (!response.ok) throw new Error('API Error');

                const data = await response.json();
                const aiMessage = data.choices[0].message.content;
                
                conversationHistory.push({ role: 'assistant', content: aiMessage });
                return aiMessage;
            } catch (error) {
                console.error('Error:', error);
                return 'متأسفم، در حال حاضر نمی‌توانم پاسخ دهم. لطفاً دوباره تلاش کنید.';
            }
        }

        async function handleSend() {
            const text = textInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            textInput.value = '';
            
            siriOrb.classList.add('listening');
            const thinkingMsg = addThinking();

            const aiResponse = await callGroqAPI(text);
            
            thinkingMsg.remove();
            siriOrb.classList.remove('listening');
            addMessage(aiResponse, 'ai');
        }

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Voice Input
        let recognition;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR';
            recognition.continuous = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                textInput.value = transcript;
                handleSend();
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };
        }

        micBtn.addEventListener('click', () => {
            if (recognition) {
                micBtn.classList.add('listening');
                recognition.start();
            } else {
                alert('مرورگر شما از تشخیص صدا پشتیبانی نمی‌کند');
            }
        });

        // PWA Install
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').classList.add('show');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('installBanner').classList.remove('show');
            }
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
        }
    </script>
</body>
</html>
